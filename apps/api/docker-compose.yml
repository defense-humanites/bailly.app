services:
  bailly-api:
    build:
      context: .
      args:
        MORPHEUS_DENO_IMAGE: ${MORPHEUS_DENO_IMAGE:-morpheus-deno:latest}
    image: bailly-api-dev
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
