services:
  bailly-api:
    build: .
    image: bailly-api
    platform: linux/amd64 # Required for the Morpheus executable
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
