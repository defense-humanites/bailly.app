services:
  bailly-api:
    container_name: bailly-api-dev
    stdin_open: true
    tty: true
    env_file:
      - .env.development
    environment:
      - DENO_DIR=/deno-dir
      - HOST_DB=${HOST_DB:-}
    volumes:
      - deno-cache:/deno-dir
      - ${HOST_DB:-host-db}:/app/database/host.db:ro
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync+restart
          path: ./deno.json
          target: /app/deno.json
volumes:
  deno-cache:
  host-db:
