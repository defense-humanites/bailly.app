services:
  bailly-api:
    container_name: bailly-api-dev
    stdin_open: true
    tty: true
    env_file:
      - .env.development
    environment:
      DENO_DIR: /deno-dir
      DENO_SQLITE_PATH: /usr/lib/libsqlite3.so.0
      HOST_DB: ${HOST_DB:-}
      MORPHEUS_LIBRARY_PATH: /opt/morpheus/lib/libmorpheus.so
      MORPHEUS_STEMLIB_PATH: /opt/morpheus/share/morpheus/stemlib
    volumes:
      - deno-cache:/deno-dir
      - ${HOST_DB:-host-db}:/host-db/host.db:ro
    tmpfs:
      - /runtime-db
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./deno.json
        - action: rebuild
          path: ./deno.lock

volumes:
  deno-cache:
  host-db:
